<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Neural</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7;
      --user: #1f6feb; --bot: #21262d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 18px; letter-spacing: 2px; }
    header h1 span { color: var(--accent); }
    header button {
      background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
    }
    header button:hover { color: var(--text); }
    #chat {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 10px;
      max-width: 800px; width: 100%; margin: 0 auto;
    }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; }
    .user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .tag { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); }
    .typing { color: var(--muted); font-style: italic; }
    form {
      display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border);
      max-width: 800px; width: 100%; margin: 0 auto;
    }
    input {
      flex: 1; padding: 12px 14px; border-radius: 10px; font-size: 15px;
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
    }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    form button {
      padding: 0 20px; border: none; border-radius: 10px; font-size: 15px;
      background: var(--accent); color: white; cursor: pointer;
    }
    form button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>PROJECT <span>NEURAL</span></h1>
    <button id="reset" title="Clear the conversation memory">New chat</button>
  </header>

  <div id="chat">
    <div class="msg bot">Hi! I'm Neural. Ask me about space, animals, computers, or say "tell me a joke".</div>
  </div>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="Type a message..." maxlength="500" autofocus>
    <button id="send">Send</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    const labels = { knowledge: "from knowledge", neural: "generated by neural net", calculator: "calculator", fallback: "" };

    function addMessage(text, cls, source) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      if (source && labels[source]) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = labels[source];
        div.appendChild(tag);
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;
      const typing = addMessage("Neural is thinking...", "bot typing");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        typing.remove();
        addMessage(data.response || data.error || "Something went wrong.", "bot", data.source);
      } catch (err) {
        typing.remove();
        addMessage("Could not reach the server. Is app.py running?", "bot");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    document.getElementById("reset").addEventListener("click", async () => {
      await fetch("/reset", { method: "POST" });
      chat.innerHTML = "";
      addMessage("Memory cleared. Let's start fresh!", "bot");
    });
  </script>
</body>
</html>
